site_name: ProObject · VBScript 개발 가이드
site_description: Alpharo 화면 개발과 VBScript 레거시 분석, ProObject·EMB 서버 개발을 위한 금융 SI 실전 가이드
site_author: Team Financial SI Study
docs_dir: docs

theme:
  name: material
  language: ko

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

  features:
    - navigation.tabs
#    - navigation.sections
    - navigation.top
    - navigation.prune
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.share

extra_css:
  - assets/css/extra.css

plugins:
  - search:
      lang: ko
  - redirects:
      redirect_maps:
        index.md: 01_env/vbscript_execution_environment.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

nav:

  - VBScript 실행환경 설정:
          - 실행 설정 개요: 01_env/vbscript_execution_environment.md
#          - Windows VBScript 실행 기능 확인: 01_env/windows_vbscript_runtime_setup.md
          - VS Code 작업 환경 구성: 01_env/vscode_workspace_setup.md
          - VS Code 실행 Task 구성: 01_env/vscode_task_setup.md
          - 스크립트 실행 및 검증: 01_env/vbscript_run_verification.md
